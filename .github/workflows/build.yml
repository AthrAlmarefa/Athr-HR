name: CI - Code Quality & Scan

on:
  pull_request:
      branches:
        - develop
        - main
        - "feature/**"
  push:
    branches: [develop, main]
env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '8.0.x'
  RUN_SONAR: 'true'
  API_IMAGE_NAME: athr.api
  DOCKER_REGISTRY: ""
  API_TAG: latest
jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Frontend (Angular)
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'Client/Client.Admin/package-lock.json'

      - name: Install Angular dependencies
        working-directory: Client/Client.Admin
        run: npm ci --no-audit

      - name: Lint Angular
        working-directory: Client/Client.Admin
        run: npm run lint --if-present

      - name: Build Angular
        working-directory: Client/Client.Admin
        run: npm run build --if-present

      # =========================
      # Backend (.NET 8)
      # =========================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET backend
        run: dotnet restore Server/Athr.sln

      - name: Build .NET backend
        run: dotnet build Server/Athr.sln --configuration Release --no-restore --verbosity minimal
  sonar-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: code-quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: ${{ env.RUN_SONAR == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AthrAlmarefa_Athr-HR
            -Dsonar.organization=athralmarefa
            -Dsonar.sources=Client/Client.Admin,Server
            -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts,**/wwwroot/**,**/bin/**,**/obj/**
            -Dsonar.cpd.exclusions=**/Migrations/**
            -Dsonar.coverage.exclusions=Client/Client.Admin,Server,Client/Client.Mobile
            -Dsonar.verbose=false

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [code-quality, sonar-test]
    steps:
      # ----------------------------
      # DOCKER BUILD
      # ----------------------------
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print project structure
        run: |
          echo "Current directory:"
          pwd
          echo "Listing:"
          ls -R .
      - name: Build API Docker Image
        run: |
          docker build -t ${{ env.API_IMAGE_NAME }}:${{ env.API_TAG }} \
            -f Server/src/Athr.Api/Dockerfile \
            Server